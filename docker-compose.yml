services:
  postgres:
    image: postgres:16-alpine
    container_name: burgoos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: burgoos
      POSTGRES_PASSWORD: burgoos
      POSTGRES_DB: burgoos
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U burgoos -d burgoos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
