openapi: 3.0.3
info:
  title: Store Onboarding and Branding API
  version: 0.1.0
  description: Contracts for creating stores and managing store visual identity.
servers:
  - url: http://localhost:3001
paths:
  /api/platform/stores:
    get:
      summary: List stores for platform administration
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Stores returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoreSummary"
    post:
      summary: Create a new store and responsible owner
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStoreRequest"
      responses:
        "201":
          description: Store created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreSetupResult"
        "400":
          description: Invalid store data
        "409":
          description: Slug or owner email already exists
  /api/platform/stores/{storeId}:
    get:
      summary: Get one store setup record
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
      responses:
        "200":
          description: Store returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreDetail"
        "404":
          description: Store not found
    patch:
      summary: Update store setup data
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStoreRequest"
      responses:
        "200":
          description: Store updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreDetail"
        "400":
          description: Invalid store data
        "409":
          description: Slug already exists
  /api/platform/stores/{storeId}/readiness:
    get:
      summary: Get launch readiness for a store
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StoreId"
      responses:
        "200":
          description: Readiness returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LaunchReadiness"
  /api/admin/store/branding:
    get:
      summary: Get current draft and published branding for the authenticated store
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Branding state returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingState"
    put:
      summary: Save branding and layout as draft
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandingDraftRequest"
      responses:
        "200":
          description: Draft saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisualConfiguration"
        "400":
          description: Invalid branding data
  /api/admin/store/branding/preview:
    post:
      summary: Validate and preview draft branding without publishing
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandingDraftRequest"
      responses:
        "200":
          description: Preview returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingPreview"
        "400":
          description: Invalid or unsafe visual configuration
  /api/admin/store/branding/publish:
    post:
      summary: Publish current branding draft
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Draft published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisualConfiguration"
        "400":
          description: No publishable draft or unsafe visual configuration
  /api/admin/store/branding/history:
    get:
      summary: List published visual configuration history
      security:
        - bearerAuth: []
      responses:
        "200":
          description: History returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VisualConfiguration"
  /api/admin/store/branding/restore:
    post:
      summary: Restore the most recent previously published visual configuration
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Previous configuration restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisualConfiguration"
        "404":
          description: No previous published configuration available
  /api/public/tenants/{slug}:
    get:
      summary: Get public store identity including branding summary
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Public store returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicStore"
        "404":
          description: Store not found or inactive
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    StoreId:
      name: storeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
  schemas:
    CreateStoreRequest:
      type: object
      example:
        name: Loja Centro
        slug: loja-centro
        phone: "5511999999999"
        active: true
        isOpen: false
        owner:
          name: Dona Maria
          email: maria@example.com
          temporaryPassword: trocar123
      required:
        - name
        - slug
        - phone
        - owner
      properties:
        name:
          type: string
          example: Loja Centro
        slug:
          type: string
          example: loja-centro
        phone:
          type: string
          example: "5511999999999"
        active:
          type: boolean
          default: true
        isOpen:
          type: boolean
          default: false
        owner:
          $ref: "#/components/schemas/CreateStoreOwner"
    CreateStoreOwner:
      type: object
      required:
        - name
        - email
        - temporaryPassword
      properties:
        name:
          type: string
          example: Dona Maria
        email:
          type: string
          format: email
          example: maria@example.com
        temporaryPassword:
          type: string
          format: password
          example: trocar123
    UpdateStoreRequest:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        phone:
          type: string
        active:
          type: boolean
        isOpen:
          type: boolean
    StoreSummary:
      type: object
      example:
        id: "11111111-1111-4111-8111-111111111111"
        name: Loja Centro
        slug: loja-centro
        active: true
        isOpen: false
        readiness:
          ready: true
          checks:
            - key: slug
              passed: true
              message: Slug publico valido
      required:
        - id
        - name
        - slug
        - active
        - isOpen
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        active:
          type: boolean
        isOpen:
          type: boolean
        readiness:
          $ref: "#/components/schemas/LaunchReadiness"
    StoreDetail:
      allOf:
        - $ref: "#/components/schemas/StoreSummary"
        - type: object
          properties:
            phone:
              type: string
            owner:
              $ref: "#/components/schemas/OwnerSummary"
            branding:
              $ref: "#/components/schemas/VisualConfiguration"
    StoreSetupResult:
      type: object
      example:
        store:
          id: "11111111-1111-4111-8111-111111111111"
          name: Loja Centro
          slug: loja-centro
          phone: "5511999999999"
          active: true
          isOpen: false
        owner:
          id: "22222222-2222-4222-8222-222222222222"
          name: Dona Maria
          email: maria@example.com
      required:
        - store
        - owner
      properties:
        store:
          $ref: "#/components/schemas/StoreDetail"
        owner:
          $ref: "#/components/schemas/OwnerSummary"
    OwnerSummary:
      type: object
      required:
        - id
        - name
        - email
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
    BrandingDraftRequest:
      type: object
      example:
        logoUrl: https://example.com/logo.png
        primaryColor: "#C92A2A"
        accentColor: "#F59F00"
        neutralTheme: LIGHT
        layoutPreset: visual
      required:
        - primaryColor
        - accentColor
        - neutralTheme
        - layoutPreset
      properties:
        logoUrl:
          type: string
          format: uri
          nullable: true
        primaryColor:
          type: string
          example: "#C92A2A"
        accentColor:
          type: string
          example: "#F59F00"
        neutralTheme:
          type: string
          enum: [LIGHT, DARK, SYSTEM_DEFAULT]
        layoutPreset:
          type: string
          enum: [classic, compact, visual]
    BrandingState:
      type: object
      example:
        draft: null
        published:
          id: "33333333-3333-4333-8333-333333333333"
          status: PUBLISHED
          logoUrl: https://example.com/logo.png
          primaryColor: "#C92A2A"
          accentColor: "#F59F00"
          neutralTheme: LIGHT
          layoutPreset: classic
          publishedAt: "2026-06-01T12:00:00.000Z"
        availableLayouts:
          - key: classic
            name: Classico
            description: Menu familiar com categorias em destaque.
            active: true
          - key: compact
            name: Compacto
            description: Menu denso para cardapios com muitas categorias e produtos.
            active: true
          - key: visual
            name: Visual
            description: Menu com mais destaque para fotos e identidade da marca.
            active: true
      properties:
        draft:
          $ref: "#/components/schemas/VisualConfiguration"
        published:
          $ref: "#/components/schemas/VisualConfiguration"
        availableLayouts:
          type: array
          items:
            $ref: "#/components/schemas/LayoutPreset"
    BrandingPreview:
      type: object
      required:
        - safeToPublish
        - warnings
        - configuration
      properties:
        safeToPublish:
          type: boolean
        warnings:
          type: array
          items:
            type: string
        configuration:
          $ref: "#/components/schemas/VisualConfiguration"
    VisualConfiguration:
      type: object
      example:
        id: "33333333-3333-4333-8333-333333333333"
        status: PUBLISHED
        logoUrl: https://example.com/logo.png
        primaryColor: "#C92A2A"
        accentColor: "#F59F00"
        neutralTheme: LIGHT
        layoutPreset: visual
        publishedAt: "2026-06-01T12:00:00.000Z"
      required:
        - id
        - status
        - primaryColor
        - accentColor
        - neutralTheme
        - layoutPreset
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [DRAFT, PUBLISHED, ARCHIVED]
        logoUrl:
          type: string
          nullable: true
        primaryColor:
          type: string
        accentColor:
          type: string
        neutralTheme:
          type: string
          enum: [LIGHT, DARK, SYSTEM_DEFAULT]
        layoutPreset:
          type: string
        publishedAt:
          type: string
          format: date-time
          nullable: true
    LayoutPreset:
      type: object
      required:
        - key
        - name
        - description
        - active
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: string
        active:
          type: boolean
    LaunchReadiness:
      type: object
      required:
        - ready
        - checks
      properties:
        ready:
          type: boolean
        checks:
          type: array
          items:
            type: object
            required:
              - key
              - passed
              - message
            properties:
              key:
                type: string
              passed:
                type: boolean
              message:
                type: string
    PublicStore:
      type: object
      required:
        - id
        - name
        - slug
        - isOpen
        - branding
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        isOpen:
          type: boolean
        branding:
          $ref: "#/components/schemas/VisualConfiguration"
